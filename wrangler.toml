name = "cta-access-map"
main = "src/worker.js"
compatibility_date = "2026-10-06"
# Serve on cta-access-map.jaconaway1.workers.dev. Per-version preview URLs are off: each would be a new
# hostname that Stadia rejects (tiles 401) unless registered there.
workers_dev = true
preview_urls = false
# Keep variables set in the dashboard across `wrangler deploy` (Workers Builds runs it on every push). Without this,
# a dashboard variable saved as plain text, like METRA_API_TOKEN once was, is wiped by the next deploy. Secrets
# survive anyway; never put their values here.
keep_vars = true

[assets]
directory = "./public"

# Deployed version ID and time, shown on /status.
[version_metadata]
binding = "CF_VERSION"

# Last good copy of Metra's alert feed (see src/metra.js). The namespace ID isn't a secret: it's only usable from
# this Cloudflare account. The binding must live here, not in the dashboard, or deploys would drop it.
[[kv_namespaces]]
binding = "CACHE"
id = "0afc61d11e2d4d31aed30f6c4c7e50f2"

# Refresh the stored Metra alerts every 5 minutes (refreshMetra: up to 4 tries, 45 s apart).
[triggers]
crons = ["*/5 * * * *"]
