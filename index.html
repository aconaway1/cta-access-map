<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop L Access Map</title>
<meta name="description" content="Elevator access at CTA L stations in the Loop and West Loop, with live elevator outages.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <div class="head">
    <h1>Loop L access</h1>
    <button id="toggle" aria-expanded="true" aria-label="Collapse key"><i class="ti ti-chevron-up"></i></button>
  </div>
  <div id="body">
    <div class="row">
      <span class="k"><span class="dot y"><i class="ti ti-elevator"></i></span>Elevator</span>
      <span class="k"><span class="dot n"><i class="ti ti-stairs"></i></span>Stairs only</span>
      <span class="k"><span class="dot c"><i class="ti ti-barrier-block"></i></span>Closed</span>
      <span class="k"><span class="dot y alert"><i class="ti ti-elevator"></i></span>Elevator out</span>
    </div>
    <div class="row lines">
      <span class="k"><i class="sw" style="--c:#C60C30"></i>Red</span>
      <span class="k"><i class="sw" style="--c:#00A1DE"></i>Blue</span>
      <span class="k"><i class="sw" style="--c:#62361B"></i>Brown</span>
      <span class="k"><i class="sw" style="--c:#009B3A"></i>Green</span>
      <span class="k"><i class="sw" style="--c:#F9461C"></i>Orange</span>
      <span class="k"><i class="sw" style="--c:#E27EA6"></i>Pink</span>
      <span class="k"><i class="sw" style="--c:#522398"></i>Purple</span>
      <span class="k"><i class="sw dash"></i>Subway</span>
    </div>
    <p class="note">Loop: Brown runs counterclockwise (outer track). Orange, Pink and Purple run clockwise (inner track). Green runs both ways on Lake and Wabash.</p>
    <p id="status" class="note">Checking live elevator alerts…</p>
  </div>
</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<script src="app.js"></script>
</body>
</html>
